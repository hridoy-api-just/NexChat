name: Build NexChat APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Build standalone APK
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexChat-APK
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
